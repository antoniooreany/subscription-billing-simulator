name: CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  unit:
    name: Unit and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Format check
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files are not gofmt-formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -v

  integration:
    name: Integration with Postgres
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d billing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/billing?sslmode=disable
      AUTO_MIGRATE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        shell: bash
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d billing && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Run tests
        run: go test ./... -count=1 -v
